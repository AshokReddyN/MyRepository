# MongoDB Configuration for Docker Compose
# This will be overridden by the SPRING_DATA_MONGODB_URI environment variable
# set in docker-compose.yml if present, but serves as a good default for this profile.
spring.data.mongodb.uri=mongodb://mongodb:27017/user_management_docker

# Optional: Any other Docker-specific settings
# For example, if you wanted a different server port only for this profile:
# server.port=8081
# (Ensure docker-compose.yml port mapping matches if you change this)

# Logging level for docker profile (example)
logging.level.com.example.usermanagement=DEBUG
logging.level.org.springframework.data.mongodb=INFO # Example: Set MongoDB driver logging to INFO for this profile
