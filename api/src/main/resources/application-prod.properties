# MongoDB Configuration for Production
spring.data.mongodb.uri=mongodb://prod-mongo-host1:27017,prod-mongo-host2:27017/user_management_prod?replicaSet=rs0

# Fast2SMS API Configuration (Actual Keys for Production - Use Environment Variables or Secrets Manager)
fast2sms.api.key=${FAST2SMS_API_KEY} # Loaded from environment variable
fast2sms.api.url=https://www.fast2sms.com/dev/bulkV2

# JWT Configuration (Actual Secret for Production - Use Environment Variables or Secrets Manager)
jwt.secret=${JWT_SECRET} # Loaded from environment variable
jwt.expiration.ms=86400000 # 24 hours
