# Default Spring profile
spring.profiles.active=dev

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/user_management_dev

# Fast2SMS API Configuration (Placeholders)
fast2sms.api.key=YOUR_FAST2SMS_API_KEY
fast2sms.api.url=https://www.fast2sms.com/dev/bulkV2

# JWT Configuration (Placeholders)
jwt.secret=YOUR_JWT_SECRET
jwt.expiration.ms=86400000 # 24 hours

# Springdoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
